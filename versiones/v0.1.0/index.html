<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<title>DR-11 · Techno Drum Machine</title>
<style>
/* ===== DR-11 · estilos ===== */
:root{--bg:#1e1e1e;--panel:#2a2a2a;--line:#3a3a3a;--txt:#e6e6e6;--dim:#8d8d8d;--acc:#00d1ff;--warn:#ff4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);user-select:none;-webkit-user-select:none}
button,select,input{font:inherit;color:inherit}
button,select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:0 10px;min-height:40px;cursor:pointer;touch-action:manipulation}
button:active{filter:brightness(1.4)}
button.on{background:var(--acc);color:#000;border-color:var(--acc)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=range]{accent-color:var(--acc);width:100%;height:32px;margin:0;touch-action:pan-y}
input[type=number],input[type=text]{background:#161616;border:1px solid var(--line);border-radius:6px;min-height:40px;padding:0 8px;width:72px;user-select:text;-webkit-user-select:text}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px}
.brand{font-weight:800;letter-spacing:2px;color:var(--acc);font-size:18px;margin-right:4px}
#play{min-width:56px;font-size:18px}
.fld{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.fld input[type=range]{width:90px}
.sp{flex:1}
#meter{width:70px;height:14px;background:#111;border:1px solid var(--line);border-radius:3px}
main{padding:8px;max-width:1280px;margin:0 auto}
/* chips de pista (móvil) */
#chips{display:none;gap:6px;overflow-x:auto;padding:8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:0 0 auto;min-width:52px;font-weight:700;border-bottom:3px solid var(--c)}
#chips button.sel{background:var(--c);color:#000}
#chips button.muted{opacity:.4}
/* rejilla */
.row{display:flex;gap:6px;align-items:center;margin-bottom:4px;border-radius:6px;padding:2px}
.row.sel{background:#262626;box-shadow:inset 3px 0 0 var(--c)}
.head{display:flex;gap:4px;align-items:center;flex:0 0 200px;min-width:0}
.head .nm{flex:1;min-width:0;text-align:left;border-left:4px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:36px}
.head .ms{min-width:34px;padding:0;min-height:36px;font-weight:700;font-size:12px}
.ms.m.on{background:var(--warn);border-color:var(--warn);color:#000}
.ms.s.on{background:#ffd400;border-color:#ffd400;color:#000}
.pads{flex:1;display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.pad{position:relative;min-height:36px;padding:0;border-radius:4px;background:#333;border:1px solid #444;overflow:hidden}
.pad:nth-child(4n+1){background:#3d3d3d}
.pad.on{background:var(--c);border-color:var(--c);opacity:var(--v,1)}
.pad.acc::after{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:#fff}
.pad.prob::before{content:"%";position:absolute;right:2px;bottom:0;font-size:9px;color:#000;font-weight:700}
.pad.cur{box-shadow:0 0 0 2px #fff inset;filter:brightness(1.5)}
/* carril de velocity / probabilidad */
#lanebox{background:var(--panel);border-radius:8px;padding:8px;margin:8px 0}
.modes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.modes .lbl{color:var(--dim);font-size:12px;margin-right:2px}
.modes button{min-height:34px}
#lane{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;height:84px;touch-action:none;cursor:ns-resize}
#lane div{background:#1b1b1b;border-radius:3px;position:relative;overflow:hidden}
#lane i{position:absolute;left:0;right:0;bottom:0;background:#555}
#lane .on i{background:var(--c)}
/* paneles */
#tabs{display:none;gap:6px;margin-bottom:8px}
#tabs button{flex:1}
#panels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.panel{background:var(--panel);border-radius:8px;padding:10px}
.panel h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--acc)}
.ctl{display:grid;grid-template-columns:84px 1fr 40px;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.ctl output{text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btns button{flex:1}
.big{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}
#sdesc{color:var(--dim);font-size:12px;min-height:32px;margin:6px 0}
select{max-width:100%}
/* modal */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#modal.open{display:flex}
#mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;width:100%;max-width:420px;max-height:85vh;overflow:auto}
#mbox h3{margin:0 0 10px;color:var(--acc)}
#mbox .li{display:flex;gap:6px;align-items:center;margin:6px 0}
#mbox .li span{flex:1;overflow:hidden;text-overflow:ellipsis}
#mbox input[type=text]{flex:1;width:auto}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000;border:1px solid var(--acc);padding:8px 14px;border-radius:20px;display:none;z-index:20;max-width:90vw}
/* ===== móvil: una pista cada vez ===== */
@media (max-width:820px){
  #chips{display:flex}
  .row{display:none}
  .row.sel{display:block;background:none;box-shadow:none;padding:0}
  .head{flex:none;margin-bottom:8px}
  .head .ms{min-width:48px;min-height:40px}
  .head .nm{min-height:40px}
  .pads{grid-template-columns:repeat(8,1fr);gap:5px}
  .pad{min-height:54px;border-radius:6px}
  #lane{height:96px}
  #tabs{display:flex}
  #panels{display:block}
  .panel{display:none}
  .panel.show{display:block}
  .fld.sw span{display:none}
  .brand{font-size:16px}
  input[type=number],input[type=text],select{font-size:16px} /* evita el zoom automático de iOS */
  .modes button{min-height:40px}
  #undo,#redo{min-width:40px}
  header button{padding:0 8px}
}
</style>
</head>

      <div id="trCtl"></div>

    <div class="panel" id="pFx"><h2 data-i18n="fxmaster">Efectos y master</h2>

      <div class="ctl"><span data-i18n="dlytime">Tiempo delay</span><select id="div"><option>1/16</option><option>1/8</option><option>3/16</option><option>1/4</option></select><span></span></div>
    </div>
    <div class="panel" id="pAsst"><h2 data-i18n="assistant">Asistente</h2>
      <div class="ctl"><span data-i18n="style">Estilo</span><select id="style"></select><span></span></div>
      <div id="sdesc"></div>

    </div>
  </section>
</main>
<div id="modal"><div id="mbox" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>

/* ---------- 7. Scheduler con lookahead (setTimeout + currentTime) ---------- */

/* ---------- 8. Exportación WAV (OfflineAudioContext, misma cadena) ---------- */

/* ---------- 9. Asistente: escribe pasos y parámetros normales, siempre deshacibles ---------- */

  const st = curStyle(); $('style').value = st.id; [...$('style').options].forEach((o, k) => (o.textContent = STYLES[k].name[lang] + ' · ' + STYLES[k].bpm)); $('sdesc').textContent = st.desc[lang];
}
// Bucle de dibujo: paso actual iluminado (sincronizado con el reloj de audio) y medidor de pico
let mBuf = null, clipHold = 0;
function frame() {
  requestAnimationFrame(frame);
  let cur = -1;
  if (seq.playing && ctx) { const now = ctx.currentTime; while (seq.q.length > 1 && seq.q[1].t <= now) seq.q.shift(); if (seq.q.length && seq.q[0].t <= now) cur = seq.q[0].st; }
  if (cur !== ui.cur) { for (let i = 0; i < NT; i++) { if (ui.cur >= 0) ui.pads[i][ui.cur].classList.remove('cur'); if (cur >= 0) ui.pads[i][cur].classList.add('cur'); } ui.cur = cur; }
  if (!analyser) return;
  if (!mBuf) mBuf = new Float32Array(analyser.fftSize);
  let pk = 0;
  if (analyser.getFloatTimeDomainData) { analyser.getFloatTimeDomainData(mBuf); for (let i = 0; i < mBuf.length; i++) { const a = Math.abs(mBuf[i]); if (a > pk) pk = a; } }
  const cv = $('meter'), g = cv.getContext('2d'), w = cv.width, h = cv.height;
  if (pk > 0.97) clipHold = 40; else if (clipHold) clipHold--;
  g.clearRect(0, 0, w, h); g.fillStyle = clipHold ? '#ff4d4d' : pk > 0.7 ? '#ffd400' : '#00d1ff'; g.fillRect(0, 0, Math.min(1, pk) * w, h);
}
/* --- Diálogos --- */
function openModal(title) { const b = $('mbox'); b.textContent = ''; b.append(el('h3', '', title)); $('modal').classList.add('open'); return b; }
function closeModal() { $('modal').classList.remove('open'); }
function closeBtn(b) { const r = el('div', 'btns'), c = el('button', '', t('close')); c.onclick = closeModal; r.append(c); b.append(r); }
function patternsDialog() {
  const b = openModal(t('patterns')), row = el('div', 'li'), inp = el('input'), sv = el('button', 'big', t('save'));
  inp.type = 'text'; inp.maxLength = 30; inp.placeholder = t('name'); inp.setAttribute('aria-label', t('name'));
  sv.onclick = () => { let n = inp.value.trim(); if (!n) { let k = 1; while (store.pats['Pattern ' + k]) k++; n = 'Pattern ' + k; } else if (store.pats[n] && !confirm(t('overwrite'))) return; store.pats[n] = JSON.parse(JSON.stringify(S)); if (saveStore()) toast(t('saved')); patternsDialog(); };
  row.append(inp, sv); b.append(row);
  const names = Object.keys(store.pats);
  if (!names.length) b.append(el('p', '', t('none')));
  names.forEach(n => {
    const li = el('div', 'li'), ld = el('button', '', t('load')), dl = el('button', '', t('del'));
    ld.onclick = () => { cmd(() => { S = migrate(store.pats[n]); }); closeModal(); toast(t('loaded')); };
    dl.onclick = () => { if (confirm(t('confirmDel'))) { delete store.pats[n]; saveStore(); patternsDialog(); } };
    li.append(el('span', '', n), ld, dl); b.append(li);
  });
  const r = el('div', 'btns'), nw = el('button', '', t('newPat'));
  nw.onclick = () => { cmd(() => { const st = S.style; S = newState(); S.style = st; }); closeModal(); };
  r.append(nw); b.append(r); closeBtn(b);
}
function exportDialog() {
  const b = openModal(t('exportT')), row = el('div', 'li'), sel = el('select'), go = el('button', 'big', t('exportB'));
  [1, 2, 4, 8, 16].forEach(n => { const o = el('option', '', n); o.value = n; if (n === 4) o.selected = true; sel.append(o); });
  sel.setAttribute('aria-label', t('bars'));
  go.onclick = () => { closeModal(); exportWav(+sel.value); };
  row.append(el('span', '', t('bars')), sel, go); b.append(row, el('p', '', t('exportNote'))); closeBtn(b);
}

/* ---------- Arranque ---------- */
loadStore(); lang = store.lang;
S = store.cur ? migrate(store.cur) : newState();
buildUI();
if (!store.cur) { generate(true); H.u.length = 0; } // primer arranque: groove base del estilo, listo para sonar
refresh();
// Gancho para pruebas automáticas (no afecta al uso normal)
window.DR11 = { VERSION, get S() { return S; }, seq, renderOffline, wavBlob, migrate, undo, redo, STYLES };
</script>
